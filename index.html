<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Prep App</title>
<meta name="description" content="Seguimiento de preparación: entreno, dieta, medidas y fotos. Todo en local.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prep">
<meta name="theme-color" content="#0d7a5f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#15181d;--muted:#6b7280;--line:#e4e7ec;
  --accent:#0d7a5f;--accent-2:#0f9b78;--accent-soft:#dff3ec;--warn:#b45309;--warn-soft:#fdf1dc;--danger:#b42318;--danger-soft:#fde8e6;
  --p:#2563eb;--c:#d97706;--f:#db2777;--kcal:#0d7a5f;
  --radius:14px;--tab-h:62px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#181b22;--text:#eef0f4;--muted:#9aa3b2;--line:#2a2f3a;--accent:#2fb58e;--accent-2:#4fd1a8;--accent-soft:#163a31;--warn:#f1b24a;--warn-soft:#3a2a10;--danger:#f0716a;--danger-soft:#3b1a18;--p:#6ea0ff;--c:#f5a742;--f:#f06aa6;--kcal:#2fb58e}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--tab-h) + var(--sab));overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:24px;font-weight:800}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}
.right{text-align:right}
.center{text-align:center}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:20px}
main{padding:14px 16px 24px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.tight{padding:10px 12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:42px;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:9px}
.btn.xs{padding:3px 8px;min-height:26px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn.icon{width:38px;padding:0;min-height:38px}
.btn:disabled{opacity:.5}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.gray{background:var(--line);color:var(--muted)}
.pill.p{background:color-mix(in srgb,var(--p) 18%,transparent);color:var(--p)}
.pill.c{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.pill.f{background:color-mix(in srgb,var(--f) 18%,transparent);color:var(--f)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--sab));padding-bottom:var(--sab);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 0}
nav.tabs button.active{color:var(--accent)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list>*+*{border-top:1px solid var(--line)}
.li{padding:10px 0;display:flex;gap:10px;align-items:center}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:800;line-height:1.1}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat .d{font-size:12px;font-weight:600;margin-top:2px}
.up{color:var(--accent)}.down{color:var(--danger)}
.macro-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:8px 0}
.macro-bar span{display:block;height:100%}
.ring{width:84px;height:84px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.set-row{display:grid;grid-template-columns:62px 1fr 1fr 34px;gap:6px;align-items:center;padding:5px 0}
.set-row input{padding:8px 6px;text-align:center;font-weight:700;font-size:17px}
.set-row .t{font-size:11px;font-weight:700;color:var(--muted);line-height:1.1}
.set-row .t b{display:block;color:var(--text);font-size:12px}
.set-row.done input{background:var(--accent-soft)}
.tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.ex-head h3{font-size:15px}
.ref{font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 8px;margin:6px 0}
.ref b{color:var(--text)}
.sugg{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 8px;margin:6px 0;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--sab))}
.modal h2{margin-bottom:10px}
.drag{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 12px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-grid .ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.photo-grid img{width:100%;height:100%;object-fit:cover;display:block}
.photo-grid .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 6px;font-weight:600}
.photo-grid .add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--sab) + 12px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted)}
.chart .ax{stroke:var(--line)}
.rating{display:flex;gap:4px}
.rating button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-weight:700}
.rating button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:28px}
.timer-bar{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + var(--sab) + 10px);background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.check input{width:22px;height:22px;margin:2px 0 0;flex:none}
.opt{display:flex;align-items:center;gap:8px;padding:6px 0}
.opt .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.sel .r{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--card)}
.macro-line{display:flex;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}
.macro-line .mp{color:var(--p)}.macro-line .mc{color:var(--c)}.macro-line .mf{color:var(--f)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.alert{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
.alert.ok{border-color:var(--accent);background:var(--accent-soft)}
.hist-badge{font-size:10px;background:var(--line);color:var(--muted);padding:2px 6px;border-radius:6px;font-weight:700}
details summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--muted);font-weight:400;font-size:18px}
details[open] summary::after{content:"–"}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.spacer{height:8px}
.sortable .handle{color:var(--muted);cursor:grab;padding:4px}
.fab{position:fixed;right:16px;bottom:calc(var(--tab-h) + var(--sab) + 14px);width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:25}
.sticky-bottom{position:sticky;bottom:calc(var(--tab-h) + var(--sab) + 8px);z-index:10}
@media (min-width:600px){.set-row input{font-size:16px}}
.lnk{color:var(--accent);font-weight:600;margin-top:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scanbox{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanline{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff3b30;box-shadow:0 0 8px #ff3b30;opacity:.85}

</style>
</head>
<body>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>
<script>
/* ====== DATOS SEMILLA (extraídos de RUTINA 1, RUTINA 2, GUIA ENTRENO e ISAK 15-03-2026) ====== */
const SEED = (() => {
  const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);

  // ---------- FASES (Guía de entreno) ----------
  const FASES = {
    1: { nombre: 'Fase 1 · Ascendente 15-12-10', corto: 'F1', desc: 'Sistema ascendente 15-12-10: las repeticiones bajan mientras sube la carga entre series. A menos repeticiones, más peso. Aquí sí se acumula fatiga en las series.', series: [{ t: 'ef', reps: 15 }, { t: 'ef', reps: 12 }, { t: 'ef', reps: 10 }] },
    2: { nombre: 'Fase 2 · Ascendente 10-8-6', corto: 'F2', desc: 'Seguimos ascendente pero con menos repeticiones y series: 10-8-6. Usa como referencia las cargas de la Fase 1 y trata de subirlas aprovechando que hay menos volumen.', series: [{ t: 'ef', reps: 10 }, { t: 'ef', reps: 8 }, { t: 'ef', reps: 6 }] },
    3: { nombre: 'Fase 3 · Topset + Backoff', corto: 'F3', desc: 'Series de aproximación (1-4 reps, sin fatiga) y 2 series efectivas: una TOPSET en rango 6-10 reps con la máxima carga posible y una BACKOFF (−30% carga) en rango 10-15 reps, con excéntrica más lenta. Cuando llegues al tope del rango en la TOPSET, sube carga la siguiente sesión.', series: [{ t: 'aprox', reps: 4 }, { t: 'aprox', reps: 2 }, { t: 'top', min: 6, max: 10 }, { t: 'back', min: 10, max: 15 }] },
    4: { nombre: 'Fase 4 · 2 Topset + Backoff', corto: 'F4', desc: '3 series efectivas: 2 TOPSET en rango 5-8 reps y 1 BACKOFF en 8-12. Si en la TOPSET 1 te quedas en 7-8 reps, sube carga en la TOPSET 2; si no, mantén la carga y busca las mismas reps. Objetivo: máximo de reps en las 2 series.', series: [{ t: 'aprox', reps: 4 }, { t: 'aprox', reps: 2 }, { t: 'top1', min: 5, max: 8 }, { t: 'top2', min: 5, max: 8 }, { t: 'back', min: 8, max: 12 }] },
    5: { nombre: 'Fase 5 · Descarga', corto: 'F5', desc: 'Semana o 10 días de descarga: series lineales tipo 3x12 o 4x10 con carga al 80% (RIR 2 aprox). Sin técnicas de intensidad.', series: [{ t: 'ef', reps: 10 }, { t: 'ef', reps: 10 }, { t: 'ef', reps: 10 }, { t: 'ef', reps: 10 }] },
  };

  const TECNICAS = {
    DS: { nombre: 'Drop set', desc: 'Serie extra tras la última serie del ejercicio bajando la carga un 40% aprox. y sin descanso, hasta el fallo.', factor: 0.6 },
    RP: { nombre: 'Rest pause', desc: 'Tras la última serie, pausa de 10-15 s sin bajar carga y añade repeticiones extra hasta el fallo (suelen salir 2-3).', factor: 1 },
    CL: { nombre: 'Cluster 5x5', desc: '5 series de 5 repeticiones con 10 s de descanso entre ellas, bajando la carga ~50% respecto a la última serie.', factor: 0.5 },
    SS: { nombre: 'Superserie', desc: 'Dos ejercicios alternando una serie de cada uno sin descanso entre ellos. Se marcan como SS1, SS2…', factor: 1 },
    PP: { nombre: 'Pulso & parada', desc: 'Repeticiones con parada isométrica y pulsos en el punto de máxima tensión.', factor: 1 },
  };

  // helper: parse "42,5*5" -> {kg:42.5, reps:5}
  const pk = (s) => {
    if (s == null || s === '-' ) return null;
    if (typeof s === 'number') return { kg: s };
    const m = String(s).replace(',', '.').match(/([\d.]+)\s*\*\s*(\d+)/);
    if (m) return { kg: +m[1], reps: +m[2] };
    const n = parseFloat(String(s).replace(',', '.'));
    return isNaN(n) ? null : { kg: n };
  };
  const ex = (nombre, tec, ref) => {
    const o = { id: uid('ex'), nombre: nombre.trim(), tecnica: tec || '', notas: '', ref: ref || null };
    return o;
  };
  // ref: { f1:[kg...], f2:[kg...], f3:{top:{kg,reps}, back:{kg,reps}} }
  const R = (f1, f2, top, back) => {
    const r = {};
    if (f1) r.f1 = f1;
    if (f2) r.f2 = f2;
    if (top || back) r.f3 = { top: pk(top), back: pk(back) };
    return r;
  };

  // ---------- RUTINA 1 (5 días) ----------
  const rutina1 = {
    id: 'r1', nombre: 'Rutina 1 · Torso/Pierna 5 días', origen: 'RUTINA 1.xlsx',
    dias: [
      { id: uid('d'), nombre: 'Día 1 · Pecho + Hombro + Tríceps', ejercicios: [
        ex('Press plano con mancuernas', '', R([20, 40, 45, 50], [25, 32.5, 37.5], '42,5*5', '37,5*7')),
        ex('Press de hombro con mancuernas', '', R([10, 20, 30, 30], [5, 10, 15], '25*6', '20*10')),
        ex('Press inclinado en multipower', 'DS', R([15], [15, 20, 22.5], '25*7', '20*11')),
        ex('Elevaciones laterales con mancuernas', 'DS', R([7.5, 10, 12.5, 12.5], [10, 12.5, 15], '15*7', '12,5*10')),
        ex('Aperturas en máquina', '', R([60, 70, 75, 80], [75, 85, 100], '110*5', '95*8')),
        ex('Press francés con mancuerna unilateral', 'CL', R([7.5, 10, 12.5, 12.5], [10, 12.5, 15], '12,5*8', '10*11')),
      ] },
      { id: uid('d'), nombre: 'Día 2 · Espalda + Bíceps + Gemelos', ejercicios: [
        ex('Jalón agarre amplio', 'DS', R([50, 60, 65, 70], [60, 70, 75], '80*8', '75*7')),
        ex('Remo gironda unilateral', '', R([30, 35, 40, 45], [40, 45, 55], '60*8', '50*10')),
        ex('Seal row con mancuernas', '', R(null, [25, 30, 32.5], '35*6', '30*8')),
        ex('Pullover en polea', 'DS', R(null, [35, 45, 55], '57,5*5', '50*9')),
        ex('Curl martillo con mancuernas', 'CL', R(null, [15, 17.5, 20], '20*7', '17,5*9')),
        ex('Gemelo en prensa horizontal', '', R(null, [65, 79, 79])),
      ] },
      { id: uid('d'), nombre: 'Día 3 · Pierna completa', ejercicios: [
        ex('Extensión de cuádriceps', 'DS', R(null, [77, 91, 121], '106*8', '91*12')),
        ex('Sentadilla en multipower', '', R(null, [20, 30, 40], '60*8', '50*9')),
        ex('Prensa inclinada', 'RP', R(null, [120, 200, 240], '220*8', '180*9')),
        ex('Curl femoral sentado', '', R(null, [54, 68, 82], '80*8', '70*10')),
        ex('Peso muerto para femoral con mancuernas', '', R(null, [20, 25, 30], '35*7', '30*9')),
        ex('Búlgaras en multipower', '', R(null, [10, 15, 15])),
      ] },
      { id: uid('d'), nombre: 'Día 4 · Hombro + Gemelos', ejercicios: [
        ex('Elevaciones laterales tumbado en polea', 'DS', R(null, [10, 12.5, 15], '15*7', '10*10')),
        ex('Press con mancuernas', '', R(null, [20, 25, 27.5], '27,5*6', '22,5')),
        ex('Remo al mentón en polea baja', 'DS', R(null, [35, 40, 45], '40*8', '35*8')),
        ex('Elevaciones frontales con mancuerna en banco', '', R(null, [10, 12.5, 15], '12,5*8', '10*11')),
        ex('Pájaros en polea alta unilateral', '', R(null, [10, 10, 15], '10*9', '10*8')),
        ex('Gemelo de pie en multipower', '', R(null, [20, 20, 20])),
      ] },
      { id: uid('d'), nombre: 'Día 5 · Bíceps + Tríceps', ejercicios: [
        ex('Tríceps en polea alta con agarre V', '', R(null, [50, 57.5, 60], '45*8', '40*10')),
        ex('Fondos libres en paralelas o entre bancos', '', R(null, null, '12', '12')),
        ex('Press cerrado en multipower', '', R(null, [15, 20, 22.5], '15', '15')),
        ex('Curl alterno con mancuernas', '', R(null, [12.5, 15, 17.5], '17,5*8', '15*11')),
        ex('Curl de bíceps en banco Scott', '', R(null, [35, 42, 49], '48*6', '38*11')),
        ex('Curl martillo con cuerda en polea baja', '', R(null, [35, 40, 45], '35*8', '30*11')),
      ] },
    ],
  };

const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (this.db) return res(this.db);
      const r = indexedDB.open('prep_fotos', 1);
      r.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains('fotos')) { const st = db.createObjectStore('fotos', { keyPath: 'id' }); st.createIndex('rev', 'revId', { unique: false }); } };
      r.onsuccess = (e) => { this.db = e.target.result; res(this.db); };
      r.onerror = (e) => rej(e);
    });
  },
  async put(obj) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('fotos', 'readwrite'); tx.objectStore('fotos').put(obj); tx.oncomplete = res; tx.onerror = rej; }); },
  async get(id) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('fotos').objectStore('fotos').get(id); r.onsuccess = () => res(r.result); r.onerror = rej; }); },
  async del(id) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('fotos', 'readwrite'); tx.objectStore('fotos').delete(id); tx.oncomplete = res; tx.onerror = rej; }); },
  async byRev(revId) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('fotos').objectStore('fotos').index('rev').getAll(revId); r.onsuccess = () => res(r.result || []); r.onerror = rej; }); },
  async all() { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('fotos').objectStore('fotos').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = rej; }); },
  async clear() { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('fotos', 'readwrite'); tx.objectStore('fotos').clear(); tx.oncomplete = res; tx.onerror = rej; }); },
};
function compressImage(file, maxSide = 1400, q = 0.82) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

/* ---- Gráfico de líneas SVG ---- */
function lineChart(series, opts = {}) {
  // series: [{name, color, points:[{x: index|date, y}]}], opts: {h, yLabel, dates:[...]}
  const W = 600, H = opts.h || 200, pad = { l: 36, r: 10, t: 12, b: 24 };
  const all = series.flatMap((s) => s.points.filter((p) => p.y != null));
  if (!all.length) return `<div class="empty small">Sin datos todavía</div>`;
  const n = Math.max(...series.map((s) => s.points.length));
  let ymin = Math.min(...all.map((p) => p.y)), ymax = Math.max(...all.map((p) => p.y));
  if (opts.ymin != null) ymin = Math.min(ymin, opts.ymin);
  if (ymin === ymax) { ymin -= 1; ymax += 1; }
  const span = ymax - ymin; ymin -= span * 0.1; ymax += span * 0.1;
  const X = (i) => pad.l + (n <= 1 ? 0 : (i / (n - 1)) * (W - pad.l - pad.r));
  const Y = (v) => pad.t + (1 - (v - ymin) / (ymax - ymin)) * (H - pad.t - pad.b);
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="aspect-ratio:${W}/${H}">`;
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) { const v = ymin + (i / ticks) * (ymax - ymin); g += `<line class="ax" x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pad.l - 4}" y="${Y(v) + 3}" text-anchor="end">${n1(v, 1)}</text>`; }
  if (opts.labels) { const step = Math.ceil(n / 6); opts.labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; }); }
  if (opts.target != null && opts.target >= ymin && opts.target <= ymax) g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(opts.target)}" y2="${Y(opts.target)}" stroke="var(--warn)" stroke-dasharray="4 4"/>`;
  for (const s of series) {
    let d = '', started = false;
    s.points.forEach((p, i) => { if (p.y == null) { return; } d += (started ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1) + ' '; started = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="3 4"' : ''}/>`;
    if (!s.noDots) s.points.forEach((p, i) => { if (p.y != null) g += `<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="${s.color}"/>`; });
  }
  g += '</svg>';
  if (series.length > 1) g += `<div class="row wrap xs muted" style="gap:12px;margin-top:4px">${series.map((s) => `<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${s.color};vertical-align:middle;margin-right:4px"></span>${esc(s.name)}</span>`).join('')}</div>`;
  return g;
}

}

function macrosItem(it, diaEntreno) { const o = it.opciones[it.sel] || it.opciones[0]; if (!o) return { kcal: 0, p: 0, c: 0, f: 0 }; return macrosDe(alimentoById(o.al), cantidadItem(it, diaEntreno)); }

  <div class="row between small"><span><span class="pill p">P</span> ${Math.round(mac.p)} g${obj && obj.p ? ` <span class="muted">/ ${obj.p}</span>` : ''}</span><span><span class="pill c">C</span> ${Math.round(mac.c)} g${obj && obj.c ? ` <span class="muted">/ ${obj.c}</span>` : ''}</span><span><span class="pill f">G</span> ${Math.round(mac.f)} g${obj && obj.f ? ` <span class="muted">/ ${obj.f}</span>` : ''}</span></div>`;
}

const TIPO_SERIE = { ef: 'Serie', aprox: 'Aprox.', top: 'TOPSET', top1: 'TOPSET 1', top2: 'TOPSET 2', back: 'BACKOFF', DS: 'Drop set', RP: 'Rest pause', CL: 'Cluster 5x5' };
function labelSerie(s, idx) {
  if (s.t === 'ef') return `<b>Serie ${idx}</b>${s.reps ? ` ${s.reps} reps` : ''}`;
  if (s.t === 'aprox') return `<b>Aprox.</b>${s.reps ? ` ${s.reps} reps` : '1-4'}`;
  if (s.min) return `<b>${TIPO_SERIE[s.t]}</b>${s.min}-${s.max}`;
  if (s.t === 'DS') return `<b>Drop set</b>−40% fallo`;
  if (s.t === 'RP') return `<b>Rest pause</b>10-15s +reps`;
  if (s.t === 'CL') return `<b>Cluster</b>5x5 −50%`;
  return `<b>${TIPO_SERIE[s.t] || s.t}</b>`;
}
function seriesPorDefecto(fase, ejercicio) {
  const base = SEED.FASES[fase].series.map((s) => ({ ...s, kg: null, reps: null, done: false }));
  // técnicas de intensidad: no en descarga (F5)
  if (ejercicio.tecnica && fase !== 5) {
    const t = ejercicio.tecnica.replace(/\d/g, '');
    if (['DS', 'RP', 'CL'].includes(t)) base.push({ t, kg: null, reps: null, done: false });
  }
  return base;
}
function ultimaSesionEj(ejId, fase, excluirId) {
  const ses = S.sesiones.filter((s) => s.id !== excluirId).sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.ts || 0) - (a.ts || 0));
  let same = null, any = null;
  for (const s of ses) { const e = s.ejercicios.find((x) => x.ejId === ejId && x.series.some((r) => r.kg != null)); if (!e) continue; if (!any) any = { s, e }; if (s.fase === fase && !same) { same = { s, e }; break; } }
  return same || any;
}
function incremento(kg) { return kg >= 100 ? 5 : 2.5; }
function sugerencia(ej, fase, prev) {
  // prev: {s,e} última sesión. Devuelve texto de recomendación según guía.
  if (!prev) {
    const ref = ej.ref || {};
    if (fase === 1 && ref.f1) return `Referencia prep. anterior F1: ${ref.f1.join(' · ')} kg. Empieza en torno a esas cargas.`;
    if (fase === 2 && (ref.f2 || ref.f1)) return `Referencia prep. anterior: ${(ref.f2 || ref.f1).join(' · ')} kg. Con menos reps, intenta subir.`;
    if ((fase === 3 || fase === 4) && ref.f3?.top) return `Referencia TOPSET anterior: ${ref.f3.top.kg} kg${ref.f3.top.reps ? ' x ' + ref.f3.top.reps : ''}. Backoff ≈ ${r25(ref.f3.top.kg * 0.7)} kg.`;
    return '';
  }
  const ser = prev.e.series;
  const pf = prev.s.fase;
  if (fase <= 2) {
    const ef = ser.filter((r) => r.t === 'ef' && r.kg != null);
    if (!ef.length) return '';
    const objetivo = SEED.FASES[fase].series;
    const todas = ef.every((r, i) => r.reps != null && objetivo[i] && r.reps >= objetivo[i].reps);
    const last = ef[ef.length - 1];
    if (pf === fase && todas) return `✅ Última sesión completaste todas las reps (${ef.map((r) => r.kg).join(' · ')} kg). Sube ~${incremento(last.kg)} kg en las series que te quedaron cómodas.`;
    if (pf === fase) return `Última: ${ef.map((r) => `${r.kg}x${r.reps ?? '?'}`).join(' · ')}. Mantén carga y busca completar las reps.`;
    return `Última sesión (${SEED.FASES[pf].corto}): ${ef.map((r) => `${r.kg}x${r.reps ?? '?'}`).join(' · ')}.`;
  }
  if (fase === 3 || fase === 4) {
    const top = ser.find((r) => (r.t === 'top' || r.t === 'top1') && r.kg != null);
    const def = SEED.FASES[fase].series.find((s) => s.t === (fase === 3 ? 'top' : 'top1'));
    if (!top) { const ef = ser.filter((r) => r.kg != null); const mx = Math.max(...ef.map((r) => r.kg)); return isFinite(mx) ? `Sin topset previa. Última carga máxima ${mx} kg (${SEED.FASES[pf].corto}). Haz 2-3 aproximaciones y prueba la topset en torno a ${r25(mx * 1.05)} kg.` : ''; }
    if (pf === fase && top.reps != null && top.reps >= def.max) return `🔥 TOPSET anterior ${top.kg}x${top.reps} (tope del rango). Sube a ${top.kg + incremento(top.kg)} kg. Backoff ≈ ${r25((top.kg + incremento(top.kg)) * 0.7)} kg.`;
    if (pf === fase) return `TOPSET anterior ${top.kg}x${top.reps ?? '?'}. Mantén ${top.kg} kg y busca ${(top.reps || def.min) + 1}+ reps (rango ${def.min}-${def.max}). Backoff ≈ ${r25(top.kg * 0.7)} kg.`;
    return `TOPSET previa (${SEED.FASES[pf].corto}): ${top.kg}x${top.reps ?? '?'}. Ajusta al rango ${def.min}-${def.max}.`;
  }
  if (fase === 5) {
    const mx = Math.max(...ser.filter((r) => r.kg != null && r.t !== 'DS' && r.t !== 'CL').map((r) => r.kg));
    return isFinite(mx) ? `Descarga: ~80% de ${mx} kg → ${r25(mx * 0.8)} kg, RIR 2, sin técnicas de intensidad.` : '';
  }
  return '';
}

A._eedit = (rid, did, eid) => {

    const n = (o.nombre || '').trim();

      const ex = _ejPorNombre(n, e.id);
      if (ex) { e.id = ex.id; e.nombre = ex.nombre; e.ref = ex.ref || null; }
      else if (o.modo === 'otro') { e.id = uid('ex'); e.nombre = n; e.ref = null; }
      else { S.rutinas.forEach((r) => r.dias.forEach((d) => d.ejercicios.forEach((x) => { if (x.id === e.id) x.nombre = n; }))); }
    } else if (n) e.nombre = n;
    e.tecnica = o.tecnica; e.notas = (o.notas || '').trim();

  });
};

/* ---- Sesión de entreno ---- */
A.empezarSesion = (diaId) => {
  if (S.sesionActiva) { A.go('entreno', 'sesion'); return; }
  const r = rutinaActiva(); const d = r.dias.find((x) => x.id === diaId); if (!d) return;
  const fase = S.settings.fase;
  S.sesionActiva = {
    id: uid('ses'), fecha: today(), ts: Date.now(), inicio: Date.now(), rutinaId: r.id, diaId: d.id, diaNombre: d.nombre, fase,
    ejercicios: d.ejercicios.map((e) => ({ ejId: e.id, nombre: e.nombre, tecnica: e.tecnica, series: seriesPorDefecto(fase, e), notas: '' })),
    rpe: null, notas: '',
  };
  save(); A.go('entreno', 'sesion');
};
function viewSesion() {
  const s = S.sesionActiva; const fase = s.fase;

  <div class="row" style="margin-bottom:10px"><div class="grow"><label class="f" style="margin:0 0 4px">Fecha</label><input type="date" value="${s.fecha}" onchange="A.sesFecha(this.value)"></div><div><label class="f" style="margin:0 0 4px">Descanso</label><div class="row"><button class="btn" onclick="A.timerStart(60)">1:00</button><button class="btn" onclick="A.timerStart(90)">1:30</button><button class="btn" onclick="A.timerStart(120)">2:00</button></div></div></div>
  ${s.ejercicios.map((e, ei) => {
    const def = dia?.ejercicios.find((x) => x.id === e.ejId) || { ref: null, notas: '' };
    const prev = ultimaSesionEj(e.ejId, fase, s.id);

    return `<div class="card" id="ex-${ei}">
      <div class="ex-head"><h3 onclick="A.go('entreno','ej:${e.ejId}')">${esc(e.nombre)} ${e.tecnica ? `<span class="tag">${esc(e.tecnica)}</span>` : ''}</h3><div class="row" style="gap:4px"><button class="btn xs" onclick="A.sesSwap(${ei})" title="Sustituir">⇄</button><button class="btn xs" onclick="A.sesDelEj(${ei})">✕</button></div></div>
      ${def.notas ? `<div class="xs muted">${esc(def.notas)}</div>` : ''}
      ${prev ? `<div class="ref">Última (${fmtDate(prev.s.fecha)} · ${SEED.FASES[prev.s.fase].corto}): ${prev.e.series.filter((r) => r.kg != null).map((r) => `<b>${r.kg}</b>x${r.reps ?? '?'}${r.t !== 'ef' ? `<span class="xs"> ${TIPO_SERIE[r.t]}</span>` : ''}`).join(' · ')}</div>` : ''}
      ${sug ? `<div class="sugg">${esc(sug)}</div>` : ''}
      <div class="set-row" style="padding:0"><div class="t xs">Serie</div><div class="t xs center">KG</div><div class="t xs center">REPS</div><div></div></div>
      ${e.series.map((r, si) => `<div class="set-row ${r.done ? 'done' : ''}"><div class="t">${labelSerie(r, e.series.filter((x) => x.t === 'ef').indexOf(r) + 1)}</div><input type="number" inputmode="decimal" step="any" value="${r.kg ?? ''}" placeholder="kg" onchange="A.setKg(${ei},${si},this.value)"><input type="number" inputmode="numeric" value="${r.reps ?? ''}" placeholder="reps" onchange="A.setReps(${ei},${si},this.value)"><button class="btn xs ${r.done ? 'primary' : ''}" style="min-height:34px" onclick="A.setDone(${ei},${si})">✓</button></div>`).join('')}
      <div class="row" style="margin-top:6px"><button class="btn xs" onclick="A.addSerie(${ei})">+ serie</button><button class="btn xs" onclick="A.delSerie(${ei})">− serie</button><button class="btn xs" onclick="A.sesNota(${ei})">${e.notas ? '📝 nota' : '+ nota'}</button></div>
      ${e.notas ? `<div class="xs muted" style="margin-top:4px">${esc(e.notas)}</div>` : ''}
    </div>`;
  }).join('')}
  <button class="btn block" onclick="A.sesAddEj()">+ Añadir ejercicio extra</button>
  <div class="card" style="margin-top:12px">
    <label class="f">RPE de la sesión (1-10)</label><div class="rating">${[5, 6, 7, 8, 9, 10].map((v) => `<button class="${s.rpe === v ? 'on' : ''}" onclick="A.sesRpe(${v})">${v}</button>`).join('')}</div>
    <label class="f">Notas de la sesión (sensaciones, molestias, energía…)</label><textarea onchange="A.sesNotas(this.value)">${esc(s.notas)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn block danger" onclick="A.sesCancelar()">Descartar</button><button class="btn block primary" onclick="A.sesTerminar()">Terminar y guardar</button></div>

}
const _sa = () => S.sesionActiva;
A.sesFecha = (v) => { _sa().fecha = v; save(); };
A.setKg = (ei, si, v) => { _sa().ejercicios[ei].series[si].kg = num(v); save(); };
A.setReps = (ei, si, v) => { _sa().ejercicios[ei].series[si].reps = num(v); save(); };
A.setDone = (ei, si) => { const r = _sa().ejercicios[ei].series[si]; r.done = !r.done; if (r.done && r.kg == null) { const prev = _sa().ejercicios[ei].series[si - 1]; if (prev) { r.kg = prev.kg; } } save(); render(); if (r.done) A.timerStart(); };
A.addSerie = (ei) => { const e = _sa().ejercicios[ei]; const last = e.series[e.series.length - 1]; e.series.push({ t: 'ef', reps: last?.reps || null, kg: last?.kg ?? null, done: false }); save(); render(); };
A.delSerie = (ei) => { const e = _sa().ejercicios[ei]; if (e.series.length > 1) e.series.pop(); save(); render(); };
A.sesNota = (ei) => promptBox('Nota del ejercicio', [{ k: 'n', label: 'Nota', type: 'textarea', value: _sa().ejercicios[ei].notas }], (o) => { _sa().ejercicios[ei].notas = o.n; save(); render(); });
A.sesDelEj = (ei) => confirmBox('¿Quitar este ejercicio de la sesión de hoy?', () => { _sa().ejercicios.splice(ei, 1); save(); render(); });
A.sesSwap = (ei) => {
  const todos = [...new Set(S.rutinas.flatMap((r) => r.dias.flatMap((d) => d.ejercicios.map((e) => e.nombre))))].sort();
  promptBox('Sustituir ejercicio (solo hoy)', [{ k: 'n', label: 'Ejercicio alternativo', value: '' }], (o) => { if (!o.n) return; const e = _sa().ejercicios[ei]; const ex = S.rutinas.flatMap((r) => r.dias.flatMap((d) => d.ejercicios)).find((x) => x.nombre === o.n); e.nombre = o.n; e.ejId = ex ? ex.id : uid('ex'); e.notas = (e.notas ? e.notas + ' · ' : '') + 'Sustituto'; save(); render(); });
};
A.sesAddEj = () => promptBox('Ejercicio extra', [{ k: 'n', label: 'Nombre', value: '' }, { k: 'ns', label: 'Nº series', type: 'number', value: 3 }, { k: 'reps', label: 'Reps objetivo', type: 'number', value: 12 }], (o) => { if (!o.n) return; const ex = S.rutinas.flatMap((r) => r.dias.flatMap((d) => d.ejercicios)).find((x) => x.nombre === o.n); const series = []; for (let i = 0; i < (o.ns || 3); i++) series.push({ t: 'ef', reps: o.reps || null, kg: null, done: false }); _sa().ejercicios.push({ ejId: ex ? ex.id : uid('ex'), nombre: o.n, tecnica: '', series, notas: 'Extra' }); save(); render(); });
A.sesRpe = (v) => { _sa().rpe = v; save(); render(); };
A.sesNotas = (v) => { _sa().notas = v; save(); };
A.sesCancelar = () => confirmBox('¿Descartar el entreno sin guardar?', () => { S.sesionActiva = null; A.timerStop(); save(); A.go('entreno', 'rutina'); }, true);
A.sesTerminar = () => {
  const s = _sa();
  const hechas = s.ejercicios.filter((e) => e.series.some((r) => r.kg != null || r.reps != null));
  if (!hechas.length) { confirmBox('No has apuntado ninguna serie. ¿Guardar igualmente?', () => guardarSesion()); return; }
  guardarSesion();
  function guardarSesion() { s.duracion = Math.round((Date.now() - s.inicio) / 60000); s.ts = Date.now(); delete s.inicio; S.sesiones.push(s); S.sesionActiva = null; A.timerStop(); save(true); toast('✅ Entreno guardado'); A.go('entreno', 'rutina'); }
};

/* ---- Historial ---- */
function viewHistorial() {
  const ses = [...S.sesiones].sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.ts || 0) - (a.ts || 0));
  const porSemana = {}; ses.forEach((s) => { const d = new Date(s.fecha + 'T00:00:00'); const dow = (d.getDay() + 6) % 7; const lun = addDays(s.fecha, -dow); (porSemana[lun] = porSemana[lun] || []).push(s); });
  return setHeader('Historial', `<button class="btn sm" onclick="A.go('entreno','rutina')">← Rutina</button>`) +
    (ses.length ? Object.keys(porSemana).sort().reverse().map((lun) => `<div class="xs muted b" style="margin:12px 0 4px">SEMANA DEL ${fmtDate(lun, true)} · ${porSemana[lun].length} sesiones</div>${porSemana[lun].map((s) => { const vol = s.ejercicios.reduce((a, e) => a + e.series.reduce((b, r) => b + (r.kg || 0) * (r.reps || 0), 0), 0); return `<div class="card tight" onclick="A.go('entreno','ses:${s.id}')"><div class="row between"><div><b>${esc(s.diaNombre)}</b><div class="xs muted">${fmtDateLong(s.fecha)} · ${SEED.FASES[s.fase]?.corto || ''} · ${s.duracion || '?'} min${s.rpe ? ` · RPE ${s.rpe}` : ''}</div></div><div class="right"><div class="b">${n1(vol / 1000, 1)} t</div><div class="xs muted">volumen</div></div></div></div>`; }).join('')}`).join('') : `<div class="empty">Aún no hay sesiones guardadas.</div>`);
}
function viewSesionDetalle(id) {
  const s = S.sesiones.find((x) => x.id === id); if (!s) return viewHistorial();
  return setHeader('Sesión', `<button class="btn sm" onclick="A.go('entreno','historial')">← Historial</button>`) +
    `<div class="card"><h2>${esc(s.diaNombre)}</h2><div class="sub">${fmtDateLong(s.fecha)} · ${SEED.FASES[s.fase]?.nombre || ''} · ${s.duracion || '?'} min${s.rpe ? ` · RPE ${s.rpe}` : ''}</div>${s.notas ? `<p class="small">${esc(s.notas)}</p>` : ''}</div>
    ${s.ejercicios.map((e) => `<div class="card tight"><b>${esc(e.nombre)}</b> ${e.tecnica ? `<span class="tag">${esc(e.tecnica)}</span>` : ''}<div class="small" style="margin-top:4px">${e.series.filter((r) => r.kg != null || r.reps != null).map((r) => `<span class="pill gray" style="margin:2px 2px 2px 0">${TIPO_SERIE[r.t] || r.t}: ${r.kg ?? '?'} kg x ${r.reps ?? '?'}</span>`).join('') || '<span class="muted">sin series</span>'}</div>${e.notas ? `<div class="xs muted">${esc(e.notas)}</div>` : ''}</div>`).join('')}
    <div class="row"><button class="btn block" onclick="A.sesReabrir('${s.id}')">Editar</button><button class="btn block danger" onclick="A.sesBorrar('${s.id}')">Eliminar</button></div>`;
}
A.sesReabrir = (id) => { if (S.sesionActiva) { toast('Termina primero el entreno en curso'); return; } const i = S.sesiones.findIndex((x) => x.id === id); const s = S.sesiones.splice(i, 1)[0]; s.inicio = Date.now() - (s.duracion || 0) * 60000; S.sesionActiva = s; save(); A.go('entreno', 'sesion'); };
A.sesBorrar = (id) => confirmBox('¿Eliminar esta sesión?', () => { S.sesiones = S.sesiones.filter((x) => x.id !== id); save(); A.go('entreno', 'historial'); }, true);

/* ---- Detalle por ejercicio ---- */
function viewEjercicio(ejId) {
  const def = S.rutinas.flatMap((r) => r.dias.flatMap((d) => d.ejercicios)).find((e) => e.id === ejId);
  const nombre = def?.nombre || S.sesiones.flatMap((s) => s.ejercicios).find((e) => e.ejId === ejId)?.nombre || 'Ejercicio';
  const hist = S.sesiones.map((s) => ({ s, e: s.ejercicios.find((x) => x.ejId === ejId) })).filter((x) => x.e && x.e.series.some((r) => r.kg != null)).sort((a, b) => a.s.fecha.localeCompare(b.s.fecha));
  const pts = hist.map((h) => { const best = h.e.series.filter((r) => r.kg != null).sort((a, b) => e1rm(b.kg, b.reps) - e1rm(a.kg, a.reps))[0]; return { fecha: h.s.fecha, y: Math.round(e1rm(best.kg, best.reps)), kg: best.kg, reps: best.reps }; });
  const ref = def?.ref;
  return setHeader('Ejercicio', `<button class="btn sm" onclick="A.go('entreno','rutina')">← Volver</button>`) +
    `<div class="card"><h2>${esc(nombre)}</h2>${def?.tecnica ? `<span class="tag">${esc(def.tecnica)}</span>` : ''}${def?.notas ? `<div class="sub">${esc(def.notas)}</div>` : ''}
    ${ref ? `<div class="ref" style="margin-top:8px"><b>Preparación anterior:</b> ${ref.f1 ? `F1 ${ref.f1.join('·')} kg ` : ''}${ref.f2 ? `· F2 ${ref.f2.join('·')} kg ` : ''}${ref.f3?.top ? `· F3 TOPSET ${ref.f3.top.kg}${ref.f3.top.reps ? 'x' + ref.f3.top.reps : ''} / BACKOFF ${ref.f3.back?.kg ?? '?'}${ref.f3.back?.reps ? 'x' + ref.f3.back.reps : ''}` : ''}</div>` : ''}</div>
    <div class="card"><h3>1RM estimado (Epley) por sesión</h3>${pts.length ? lineChart([{ name: '1RM est.', color: 'var(--accent)', points: pts }], { h: 170, labels: pts.map((p) => fmtDate(p.fecha)) }) : '<div class="empty small">Sin sesiones registradas</div>'}</div>

/* ---- Alimento del plan + sustitutos ---- */
// Cantidad de `al` que aporta las mismas kcal que `kcal` (redondeada a 5 g o a media unidad)
function cantEquivalente(al, kcal) {
  if (!al || !(al.kcal > 0) || !(kcal > 0)) return defCant(al);
  const g = kcal / (al.kcal / 100);
  if (al.u === 'ud') return al.gUd > 0 ? Math.max(0.5, Math.round(g / al.gUd * 2) / 2) : 1;
  return Math.max(5, Math.round(g / 5) * 5);
}
A.itemAdd = (did, cid, escanear) => {
  const c = _cm(did, cid);
  A.pickAlimento({ title: `Añadir a ${c.nombre}`, cb: (al) => { const it = { id: uid('it'), opciones: [{ al: al.id, g: defCant(al), gd: null }], sel: 0, nota: '' }; c.items.push(it); save(); render(); A.itemEdit(did, cid, it.id); } });
  if (escanear) A.escanear();
};
A.itemEdit = (did, cid, iid) => {
  const it = _it(did, cid, iid); if (!it) return;

    ${it.opciones.map((o, i) => { const al = alimentoById(o.al); const sel = (it.sel || 0) === i; const cant = de ? o.g : (o.gd == null ? o.g : o.gd); const u = al?.u === 'ud' ? 'ud' : 'g'; return `<div class="card tight" style="margin-top:8px;${sel ? 'border-color:var(--accent)' : ''}">
      <div class="opt ${sel ? 'sel' : ''}" style="padding:0 0 6px" onclick="A._itSel('${did}','${cid}','${iid}',${i})"><div class="r"></div><div class="grow"><div class="b small">${alNom(al)} ${i === 0 ? '' : '<span class="pill gray">sustituto</span>'}</div><div class="xs muted">${al ? al100(al) : 'Este alimento ya no existe: cámbialo'}</div></div></div>
      <div class="grid2"><div><label class="f" style="margin-top:0">Día de entreno (${u})</label><input type="number" inputmode="decimal" step="any" value="${o.g}" onchange="A._opG('${did}','${cid}','${iid}',${i},'g',this.value)"></div><div><label class="f" style="margin-top:0">Descanso (${u})</label><input type="number" inputmode="decimal" step="any" value="${o.gd ?? ''}" placeholder="igual" onchange="A._opG('${did}','${cid}','${iid}',${i},'gd',this.value)"></div></div>
      <div class="row between" style="margin-top:6px">${macroLine(macrosDe(al, cant))}<div class="row" style="gap:4px"><button class="btn xs" onclick="A._opCambiar('${did}','${cid}','${iid}',${i})">Cambiar alimento</button>${it.opciones.length > 1 ? `<button class="btn xs danger" onclick="A._opDel('${did}','${cid}','${iid}',${i})">✕</button>` : ''}</div></div>
    </div>`; }).join('')}
    <button class="btn block soft" style="margin-top:10px" onclick="A._opAdd('${did}','${cid}','${iid}')">+ Añadir sustituto</button>
    <label class="f">Nota</label><input value="${esc(it.nota)}" onchange="A._itNota('${did}','${cid}','${iid}',this.value)" placeholder="p. ej. solo días de entreno">

};
A._itSel = (did, cid, iid, i) => { _it(did, cid, iid).sel = i; A._refreshIt(); };
A._opAdd = (did, cid, iid) => {
  const it = _it(did, cid, iid); const ref = it.opciones[it.sel] || it.opciones[0]; const refAl = ref && alimentoById(ref.al);
  const volver = () => A.itemEdit(did, cid, iid);
  A.pickAlimento({ title: refAl ? `Sustituto de ${refAl.nombre}` : 'Añadir sustituto', onCancel: volver, cb: (al) => {
    if (it.opciones.some((o) => o.al === al.id)) { toast('Ese alimento ya está en la lista'); volver(); return; }
    const g = ref ? cantEquivalente(al, macrosDe(refAl, ref.g).kcal) : defCant(al);
    const gd = ref && ref.gd != null && ref.gd !== ref.g ? cantEquivalente(al, macrosDe(refAl, ref.gd).kcal) : null;
    it.opciones.push({ al: al.id, g, gd }); save(); volver();
    if (refAl) toast('Cantidad ajustada a las mismas kcal', 2400);
  } });
};
A._opCambiar = (did, cid, iid, i) => {
  const it = _it(did, cid, iid); const o = it.opciones[i]; const volver = () => A.itemEdit(did, cid, iid);
  A.pickAlimento({ title: 'Cambiar alimento', onCancel: volver, cb: (al) => { const prev = alimentoById(o.al); if ((prev?.u || 'g') !== al.u) { o.g = defCant(al); o.gd = null; } o.al = al.id; save(); volver(); } });
};
A._opDel = (did, cid, iid, i) => { const it = _it(did, cid, iid); it.opciones.splice(i, 1); if (it.sel >= it.opciones.length) it.sel = 0; else if (it.sel > i) it.sel--; A._refreshIt(); };
A._opG = (did, cid, iid, i, k, v) => { const o = _it(did, cid, iid).opciones[i]; const n = num(v); if (k === 'g') o.g = n ?? 0; else o.gd = n; A._refreshIt(); };
A._itNota = (did, cid, iid, v) => { _it(did, cid, iid).nota = v; save(); };
A._itDel = (did, cid, iid) => { const c = _cm(did, cid); c.items = c.items.filter((i) => i.id !== iid); save(); closeModal(); };

function codigoDe(txt) {

async function scanStart() {
  const v = document.getElementById('sc-v'); const st = SCAN = { stop: false, stream: null, reader: null };

A.alimentoEdit = (id) => { const a = alimentoById(id); if (!a) return; promptBox('Editar alimento', AL_FIELDS(a), (o) => { const d = _alDe(o); if (!d.nombre) d.nombre = a.nombre; Object.assign(a, d); save(); render(); toast('Alimento actualizado'); }); const m = document.getElementById('modal'); const del = document.createElement('button'); del.className = 'btn block danger'; del.style.marginTop = '8px'; del.textContent = 'Eliminar alimento'; del.onclick = () => { const usado = S.dietas.some((d) => d.comidas.some((c) => c.items.some((it) => it.opciones.some((op) => op.al === id)))); confirmBox(usado ? '¿Eliminar este alimento? Está en tu dieta: allí quedará como opción vacía.' : '¿Eliminar este alimento?', () => { S.alimentos = S.alimentos.filter((x) => x.id !== id); save(); render(); }, true); }; m.querySelector('.modal').appendChild(del); };

/* ====== VISTA: PROGRESO (revisiones, peso, gráficas, fotos, ISAK) ====== */
const MEDIDAS = [['hombro', 'Hombro'], ['pecho', 'Pecho'], ['brazoD', 'Brazo D'], ['brazoI', 'Brazo I'], ['cinturaAlta', 'Cintura alta'], ['cinturaBaja', 'Cintura baja'], ['muslo', 'Muslo'], ['gemelo', 'Gemelo']];
const VALORACION = [['nutricion', 'Nutrición'], ['entreno', 'Entreno'], ['descanso', 'Descanso'], ['sensaciones', 'Sensaciones']];
const FEEDBACK = [['entreno', 'Entreno'], ['nutricion', 'Nutrición'], ['descanso', 'Descanso'], ['mindset', 'Mindset']];
const TIPOS_FOTO = ['Frente', 'Lado', 'Espalda', 'Frente relajado', 'Doble bíceps', 'Otra'];

function viewSeguimiento() {
  const sub = SUB.seguimiento || 'revisiones';
  const segs = [['revisiones', 'Revisiones'], ['graficas', 'Gráficas'], ['fotos', 'Fotos'], ['isak', 'ISAK'], ['peso', 'Peso']];
  let body = '';
  if (sub === 'revisiones') body = viewRevisiones();
  else if (sub.startsWith('rev:')) return viewRevisionDetalle(sub.slice(4));
  else if (sub === 'graficas') body = viewGraficas();
  else if (sub === 'fotos') body = viewFotos();
  else if (sub === 'isak') body = viewIsak();
  else if (sub === 'peso') body = viewPesoDiario();
  return setHeader('Progreso') + `<div class="seg" style="margin-bottom:12px">${segs.map(([k, l]) => `<button class="${sub === k ? 'active' : ''}" onclick="A.go('seguimiento','${k}')">${l}</button>`).join('')}</div>` + body;
}

/* ---- Revisiones ---- */
function viewRevisiones() {
  const hist = SUB.verHistorico;
  const revs = S.revisiones.filter((r) => !!r.historico === !!hist).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const prepRevs = revisionesPrep();
  const ultima = prepRevs[prepRevs.length - 1];
  const prox = ultima ? addDays(ultima.fecha, 14) : null;
  return `<div class="row between" style="margin-bottom:10px"><div class="seg" style="flex:1"><button class="${!hist ? 'active' : ''}" onclick="SUB.verHistorico=false;render()">Prep. actual</button><button class="${hist ? 'active' : ''}" onclick="SUB.verHistorico=true;render()">Histórico anterior</button></div>${!hist ? `<button class="btn primary sm" onclick="A.nuevaRevision()">+ Revisión</button>` : ''}</div>
  ${!hist ? `<div class="sub" style="margin-bottom:10px">${prepRevs.length ? `${prepRevs.length} revisiones desde el ${fmtDate(prepRevs[0].fecha, true)}. Próxima: <b>${fmtDateLong(prox)}</b>. Mide siempre en las mismas condiciones (mañana, en ayunas, mismo lado, cinta sin apretar).` : 'Empieza con la <b>revisión inicial (día 0)</b>: peso, medidas y fotos de frente, lado y espalda con la misma luz y la misma ropa que usarás en todas las revisiones.'}</div>` : `<div class="sub" style="margin-bottom:10px">Datos de la preparación anterior (ago 2025 – sep 2026) importados de tus Excels. Solo de consulta.</div>`}
  ${revs.length ? revs.map((r, i) => { const prev = revs[i + 1]; const d = r.peso != null && prev?.peso != null ? r.peso - prev.peso : null; return `<div class="card tight" onclick="A.go('seguimiento','rev:${r.id}')"><div class="row between"><div><b>${fmtDateLong(r.fecha)}</b> ${r.fase ? `<span class="pill gray">${esc(r.fase)}</span>` : ''}${r.fotos?.length ? ` <span class="pill">${r.fotos.length} 📷</span>` : ''}<div class="xs muted">${MEDIDAS.filter(([k]) => r.medidas?.[k] != null).slice(0, 5).map(([k, l]) => `${l.split(' ')[0]} ${n1(r.medidas[k], 1)}`).join(' · ') || 'sin medidas'}</div></div><div class="right"><div class="b" style="font-size:18px">${r.peso != null ? n1(r.peso, 2) : '—'}<span class="xs muted"> kg</span></div>${d != null ? `<div class="xs ${d > 0 ? 'up' : d < 0 ? 'down' : 'muted'}">${d > 0 ? '+' : ''}${n1(d, 2)}</div>` : ''}</div></div></div>`; }).join('') : `<div class="empty">Sin revisiones todavía.</div>`}`;
}
function formRevision(r) {
  return `<div class="grid2"><div><label class="f">Fecha</label><input id="rv-fecha" type="date" value="${r.fecha}"></div><div><label class="f">Peso (kg)</label><input id="rv-peso" type="number" inputmode="decimal" step="any" value="${r.peso ?? ''}"></div></div>
  <label class="f">Medidas (cm)</label><div class="grid2">${MEDIDAS.map(([k, l]) => `<div class="row" style="gap:6px"><span class="small muted" style="width:92px;flex:none">${l}</span><input id="rv-m-${k}" type="number" inputmode="decimal" step="any" value="${r.medidas?.[k] ?? ''}"></div>`).join('')}</div>
  <label class="f">Fase / rutina</label><input id="rv-fase" value="${esc(r.fase || '')}" placeholder="p. ej. F1 · Rutina 2">
  <label class="f">Valoración 0-5 (implicación, esfuerzo y cumplimiento)</label>
  ${VALORACION.map(([k, l]) => `<div class="row" style="margin:4px 0"><span class="small" style="width:92px;flex:none">${l}</span><div class="rating grow" id="rv-v-${k}" data-v="${r.valoracion?.[k] ?? ''}">${[0, 1, 2, 3, 4, 5].map((v) => `<button type="button" class="${r.valoracion?.[k] === v ? 'on' : ''}" onclick="A._rvRate('${k}',${v},this)">${v}</button>`).join('')}</div></div>`).join('')}
  <label class="f">Feedback por escrito</label>
  ${FEEDBACK.map(([k, l]) => `<textarea id="rv-f-${k}" placeholder="${l}: ¿cómo ha ido? ¿qué ha fallado? ¿sensaciones?" style="min-height:52px;margin-bottom:6px">${esc(r.feedback?.[k] || '')}</textarea>`).join('')}
  <label class="f">Notas</label><textarea id="rv-notas" style="min-height:48px">${esc(r.notas || '')}</textarea>`;
}
function leerFormRevision(m, r) {
  r.fecha = m.querySelector('#rv-fecha').value || today(); r.peso = num(m.querySelector('#rv-peso').value);
  r.medidas = {}; MEDIDAS.forEach(([k]) => r.medidas[k] = num(m.querySelector('#rv-m-' + k).value));
  r.fase = m.querySelector('#rv-fase').value; r.valoracion = {}; VALORACION.forEach(([k]) => { const v = m.querySelector('#rv-v-' + k).dataset.v; r.valoracion[k] = v === '' ? null : +v; });
  r.feedback = {}; FEEDBACK.forEach(([k]) => r.feedback[k] = m.querySelector('#rv-f-' + k).value); r.notas = m.querySelector('#rv-notas').value;
}
A._rvRate = (k, v, btn) => { const wrap = btn.parentElement; wrap.dataset.v = v; wrap.querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.textContent === v)); };
A.nuevaRevision = () => {
  const prevRevs = revisionesPrep(); const last = prevRevs[prevRevs.length - 1];
  const r = { id: uid('rev'), fecha: today(), historico: false, peso: S.pesoDiario.find((p) => p.fecha === today())?.kg ?? null, medidas: {}, fase: `${SEED.FASES[S.settings.fase].corto} · ${rutinaActiva().nombre.split('·')[0].trim()}`, valoracion: {}, feedback: {}, notas: '', fotos: [] };
  openModal(`<h2>${prevRevs.length ? 'Nueva revisión' : 'Revisión inicial (día 0)'}</h2>${last ? `<div class="sub">Anterior (${fmtDate(last.fecha)}): ${n1(last.peso, 2)} kg · ${MEDIDAS.filter(([k]) => last.medidas?.[k] != null).map(([k, l]) => `${l.split(' ')[0]} ${n1(last.medidas[k], 1)}`).join(' · ')}</div>` : ''}${formRevision(r)}<div class="row" style="margin-top:12px"><button class="btn block" onclick="closeModal()">Cancelar</button><button class="btn block primary" id="rv-ok">Guardar y añadir fotos</button></div>`, (m) => {
    m.querySelector('#rv-ok').onclick = () => { leerFormRevision(m, r); S.revisiones.push(r); if (r.peso != null && !S.pesoDiario.find((p) => p.fecha === r.fecha)) S.pesoDiario.push({ fecha: r.fecha, kg: r.peso }); save(true); closeModal(); toast('Revisión guardada'); A.go('seguimiento', 'rev:' + r.id); };
  });
};
A.editarRevision = (id) => {
  const r = S.revisiones.find((x) => x.id === id);
  openModal(`<h2>Editar revisión</h2>${formRevision(r)}<div class="row" style="margin-top:12px"><button class="btn block" onclick="closeModal()">Cancelar</button><button class="btn block primary" id="rv-ok">Guardar</button></div>`, (m) => { m.querySelector('#rv-ok').onclick = () => { leerFormRevision(m, r); save(true); closeModal(); render(); }; });
};
A.borrarRevision = (id) => confirmBox('¿Eliminar esta revisión y sus fotos?', async () => { const r = S.revisiones.find((x) => x.id === id); for (const f of (r.fotos || [])) await IDB.del(f.id); S.revisiones = S.revisiones.filter((x) => x.id !== id); save(); A.go('seguimiento', 'revisiones'); }, true);

function viewRevisionDetalle(id) {
  const r = S.revisiones.find((x) => x.id === id); if (!r) return viewSeguimiento();
  const lista = S.revisiones.filter((x) => !!x.historico === !!r.historico).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const idx = lista.findIndex((x) => x.id === id); const prev = lista[idx - 1]; const first = lista[0];
  setTimeout(() => cargarFotos(r), 0);
  return setHeader('Revisión', `<button class="btn sm" onclick="A.go('seguimiento','revisiones')">← Volver</button>`) +
    `<div class="card"><div class="row between"><div><h2>${fmtDateLong(r.fecha)}</h2><div class="sub">${r.historico ? '<span class="hist-badge">HISTÓRICO</span> ' : ''}${esc(r.fase || '')}</div></div><div class="row" style="gap:4px"><button class="btn sm" onclick="A.editarRevision('${r.id}')">✎</button><button class="btn sm danger" onclick="A.borrarRevision('${r.id}')">✕</button></div></div>
    ${resumenRevision(r, prev)}
    ${first && first.id !== r.id ? `<div class="xs muted" style="margin-top:8px">Desde el inicio (${fmtDate(first.fecha)}): peso ${r.peso != null && first.peso != null ? (r.peso - first.peso >= 0 ? '+' : '') + n1(r.peso - first.peso, 2) + ' kg' : '—'} · cintura alta ${r.medidas?.cinturaAlta != null && first.medidas?.cinturaAlta != null ? (r.medidas.cinturaAlta - first.medidas.cinturaAlta >= 0 ? '+' : '') + n1(r.medidas.cinturaAlta - first.medidas.cinturaAlta, 1) + ' cm' : '—'} · brazo D ${r.medidas?.brazoD != null && first.medidas?.brazoD != null ? (r.medidas.brazoD - first.medidas.brazoD >= 0 ? '+' : '') + n1(r.medidas.brazoD - first.medidas.brazoD, 1) + ' cm' : '—'}</div>` : ''}</div>
    <div class="card"><div class="row between"><h2>Fotos</h2><span class="xs muted">${(r.fotos || []).length} fotos</span></div>
      <div class="photo-grid" id="fotos-${r.id}" style="margin-top:8px">${(r.fotos || []).map((f) => `<div class="ph" id="ph-${f.id}" onclick="A.verFoto('${f.id}')"><div class="cap">${esc(f.tipo)}</div></div>`).join('')}<label class="ph add"><input type="file" accept="image/*" multiple style="display:none" onchange="A.subirFotos('${r.id}',this.files)"><span style="font-size:26px">＋</span>Galería</label><label class="ph add"><input type="file" accept="image/*" capture="environment" style="display:none" onchange="A.subirFotos('${r.id}',this.files)"><span style="font-size:26px">📷</span>Cámara</label></div>
      <div class="xs muted" style="margin-top:6px">Mismo sitio, misma luz, misma ropa, misma hora. Frente, lado y espalda relajado; opcional doble bíceps.</div></div>
    ${FEEDBACK.some(([k]) => r.feedback?.[k]) || r.notas ? `<div class="card"><h2>Feedback</h2>${FEEDBACK.filter(([k]) => r.feedback?.[k]).map(([k, l]) => `<div style="margin-top:6px"><b class="small">${l}</b><div class="small">${esc(r.feedback[k])}</div></div>`).join('')}${r.notas ? `<div style="margin-top:6px"><b class="small">Notas</b><div class="small">${esc(r.notas)}</div></div>` : ''}</div>` : ''}
    <button class="btn block" onclick="A.copiarReporte('${r.id}')">📋 Copiar reporte para enviar al coach</button>`;
}
async function cargarFotos(r) { for (const f of (r.fotos || [])) { const el = document.getElementById('ph-' + f.id); if (!el) continue; const rec = await IDB.get(f.id); if (rec) el.insertAdjacentHTML('afterbegin', `<img src="${rec.data}" alt="${esc(f.tipo)}">`); } }
A.subirFotos = async (revId, files) => {
  const r = S.revisiones.find((x) => x.id === revId); if (!r || !files.length) return;
  toast('Procesando fotos…', 4000);
  for (const file of files) {
    try { const data = await compressImage(file); const id = uid('foto'); const usados = (r.fotos || []).map((f) => f.tipo); const tipo = TIPOS_FOTO.find((t) => !usados.includes(t)) || 'Otra'; await IDB.put({ id, revId, data, fecha: r.fecha, tipo }); r.fotos = r.fotos || []; r.fotos.push({ id, tipo }); } catch (e) { toast('Error con una foto'); }
  }
  save(true); toast(`✅ ${files.length} foto(s) añadida(s)`); render();
};
A.verFoto = async (id) => {
  const rec = await IDB.get(id); if (!rec) return; const r = S.revisiones.find((x) => x.id === rec.revId); const f = r.fotos.find((x) => x.id === id);
  openModal(`<div class="row between"><h2>${fmtDate(rec.fecha, true)}</h2><button class="btn sm" onclick="closeModal()">Cerrar</button></div><img src="${rec.data}" style="width:100%;border-radius:12px;margin:8px 0"><label class="f">Tipo</label><select onchange="A._fotoTipo('${id}',this.value)">${TIPOS_FOTO.map((t) => `<option ${f.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select><div class="row" style="margin-top:10px"><a class="btn block" href="${rec.data}" download="foto_${rec.fecha}_${f.tipo}.jpg">Descargar</a><button class="btn block danger" onclick="A._fotoDel('${id}')">Eliminar</button></div>`);
};
A._fotoTipo = (id, v) => { const r = S.revisiones.find((x) => x.fotos?.some((f) => f.id === id)); const f = r.fotos.find((x) => x.id === id); f.tipo = v; save(); };
A._fotoDel = (id) => confirmBox('¿Eliminar la foto?', async () => { await IDB.del(id); S.revisiones.forEach((r) => { if (r.fotos) r.fotos = r.fotos.filter((f) => f.id !== id); }); save(); closeModal(); render(); }, true);
A.copiarReporte = (id) => {
  const r = S.revisiones.find((x) => x.id === id);
  const lista = S.revisiones.filter((x) => !!x.historico === !!r.historico).sort((a, b) => a.fecha.localeCompare(b.fecha)); const prev = lista[lista.findIndex((x) => x.id === id) - 1];
  const d = (a, b) => a != null && b != null ? ` (${a - b >= 0 ? '+' : ''}${n1(a - b, 2)})` : '';
  let t = `REVISIÓN ${fmtDate(r.fecha, true)}${r.fase ? ' · ' + r.fase : ''}\nPeso: ${n1(r.peso, 2)}${d(r.peso, prev?.peso)}\n` + MEDIDAS.map(([k, l]) => `${l}: ${n1(r.medidas?.[k], 1)}${d(r.medidas?.[k], prev?.medidas?.[k])}`).join('\n');
  t += '\n\nVALORACIÓN (0-5)\n' + VALORACION.map(([k, l]) => `${l}: ${r.valoracion?.[k] ?? '-'}`).join('\n');
  t += '\n\nFEEDBACK\n' + FEEDBACK.map(([k, l]) => `${l.toUpperCase()}: ${r.feedback?.[k] || '-'}`).join('\n');
  if (r.notas) t += '\n\nNotas: ' + r.notas;
  const ses = S.sesiones.filter((s) => s.fecha > (prev?.fecha || '0000') && s.fecha <= r.fecha); if (ses.length) t += `\n\nEntrenos en el periodo: ${ses.length}`;
  if (navigator.share) navigator.share({ text: t }).catch(() => navigator.clipboard?.writeText(t).then(() => toast('Copiado'))); else navigator.clipboard?.writeText(t).then(() => toast('Reporte copiado'));
};

/* ---- Gráficas ---- */
function viewGraficas() {
  const met = SUB.metrica || 'peso';
  const incl = SUB.graficoHist !== false;
  const revs = S.revisiones.filter((r) => incl || !r.historico).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const opts = [['peso', 'Peso'], ...MEDIDAS, ['cintura_brazo', 'Brazo − Cintura']];
  const val = (r) => met === 'peso' ? r.peso : met === 'cintura_brazo' ? (r.medidas?.brazoD != null && r.medidas?.cinturaAlta != null ? r.medidas.brazoD / r.medidas.cinturaAlta * 100 : null) : r.medidas?.[met];
  const pts = revs.map((r) => ({ y: val(r), h: r.historico }));
  const chart = lineChart([{ name: met === 'peso' ? 'Peso' : 'cm', color: 'var(--accent)', points: pts }], { h: 220, labels: revs.map((r) => fmtDate(r.fecha)), target: met === 'peso' ? S.profile.pesoObjetivo : null });
  const nums = pts.map((p) => p.y).filter((v) => v != null);
  const cur = revisionesPrep();
  return `<div class="card tight"><select onchange="SUB.metrica=this.value;render()">${opts.map(([k, l]) => `<option value="${k}" ${met === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
  <div class="check"><input type="checkbox" id="gh" ${incl ? 'checked' : ''} onchange="SUB.graficoHist=this.checked;render()"><label for="gh" class="small">Incluir histórico de la preparación anterior</label></div></div>
  <div class="card">${chart}${nums.length ? `<div class="row between xs muted" style="margin-top:6px"><span>Mín ${n1(Math.min(...nums), 1)}</span><span>Máx ${n1(Math.max(...nums), 1)}</span><span>Último ${n1(nums[nums.length - 1], 1)}</span></div>` : ''}${met === 'cintura_brazo' ? '<div class="xs muted" style="margin-top:6px">Ratio brazo/cintura ×100: si sube, estás ganando más brazo que cintura (buena señal en volumen limpio).</div>' : ''}</div>
  ${cur.length >= 2 ? `<div class="card"><h3>Tendencia de la preparación actual</h3><div class="tbl-wrap"><table><tr><th>Medida</th><th class="num">Inicio</th><th class="num">Último</th><th class="num">Δ</th></tr>${[['peso', 'Peso'], ...MEDIDAS].map(([k, l]) => { const a = k === 'peso' ? cur[0].peso : cur[0].medidas?.[k]; const b = k === 'peso' ? cur[cur.length - 1].peso : cur[cur.length - 1].medidas?.[k]; const d = a != null && b != null ? b - a : null; return `<tr><td>${l}</td><td class="num">${n1(a, 1)}</td><td class="num">${n1(b, 1)}</td><td class="num ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d != null ? (d > 0 ? '+' : '') + n1(d, 1) : '—'}</td></tr>`; }).join('')}</table></div><div class="xs muted" style="margin-top:6px">Ritmo de peso: ${ritmoPeso(cur)}</div></div>` : ''}`;
}
function ritmoPeso(cur) { const a = cur[0], b = cur[cur.length - 1]; if (a.peso == null || b.peso == null) return '—'; const sem = daysBetween(a.fecha, b.fecha) / 7; if (sem < 1) return '—'; const r = (b.peso - a.peso) / sem; return `${r >= 0 ? '+' : ''}${n1(r, 2)} kg/semana (para subir limpio lo ideal es +0,25 a +0,5 kg/semana).`; }

/* ---- Fotos ---- */
function viewFotos() {
  const revs = S.revisiones.filter((r) => r.fotos?.length).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const a = SUB.cmpA, b = SUB.cmpB;
  setTimeout(async () => { for (const r of revs) for (const f of r.fotos) { const el = document.getElementById('phg-' + f.id); if (el) { const rec = await IDB.get(f.id); if (rec) el.insertAdjacentHTML('afterbegin', `<img src="${rec.data}">`); } } if (a && b) { for (const [k, id] of [['A', a], ['B', b]]) { const rec = await IDB.get(id); const el = document.getElementById('cmp' + k); if (el && rec) el.src = rec.data; } } }, 0);
  const todas = revs.flatMap((r) => r.fotos.map((f) => ({ ...f, fecha: r.fecha })));
  return `<div class="card"><h2>Comparar</h2><div class="sub">Elige dos fotos (idealmente del mismo tipo) para verlas lado a lado.</div>

/* ---- ISAK ---- */
const PLIEGUES = [['triceps', 'Tríceps'], ['subescapular', 'Subescapular'], ['biceps', 'Bíceps'], ['crestaIliaca', 'Cresta ilíaca'], ['supraespinal', 'Supraespinal'], ['abdominal', 'Abdominal'], ['muslo', 'Muslo'], ['pierna', 'Pierna']];
const PERIMETROS = [['brazoRelajado', 'Brazo relajado'], ['brazoContraido', 'Brazo contraído'], ['cintura', 'Cintura'], ['cadera', 'Cadera'], ['musloMedio', 'Muslo medio'], ['pierna', 'Pierna']];
const DIAMETROS = [['humero', 'Húmero'], ['biestiloideo', 'Biestiloideo'], ['femur', 'Fémur']];
function calcIsak(e) {
  const p = e.pliegues || {}; const sum = (ks) => ks.every((k) => p[k] != null) ? ks.reduce((a, k) => a + p[k], 0) : null;
  const s6 = sum(['triceps', 'subescapular', 'supraespinal', 'abdominal', 'muslo', 'pierna']);
  const s8 = sum(['triceps', 'subescapular', 'biceps', 'crestaIliaca', 'supraespinal', 'abdominal', 'muslo', 'pierna']);
  const s4 = sum(['triceps', 'biceps', 'subescapular', 'crestaIliaca']);
  // Durnin & Womersley (hombres) + Siri
  const a = (() => { const b = new Date(S.profile.fechaNac); const d = new Date(e.fecha); let x = d.getFullYear() - b.getFullYear(); if (d < new Date(d.getFullYear(), b.getMonth(), b.getDate())) x--; return x; })();
  const coefM = a < 20 ? [1.1620, 0.0630] : a < 30 ? [1.1631, 0.0632] : a < 40 ? [1.1422, 0.0544] : a < 50 ? [1.1620, 0.0700] : [1.1715, 0.0779];
  const coefF = a < 20 ? [1.1549, 0.0678] : a < 30 ? [1.1599, 0.0717] : a < 40 ? [1.1423, 0.0632] : a < 50 ? [1.1333, 0.0612] : [1.1339, 0.0645];
  const [c0, c1] = S.profile.sexo === 'F' ? coefF : coefM;
  let pct = null, mg = null, mlg = null;
  if (s4) { const dens = c0 - c1 * Math.log10(s4); pct = 495 / dens - 450; if (e.masa) { mg = e.masa * pct / 100; mlg = e.masa - mg; } }
  const imc = e.masa && e.talla ? e.masa / Math.pow(e.talla / 100, 2) : null;
  const pr = e.perimetros || {};
  const icc = pr.cintura && pr.cadera ? pr.cintura / pr.cadera : null;
  const ict = pr.cintura && e.talla ? pr.cintura / e.talla : null;
  const brazoCorr = pr.brazoRelajado != null && p.triceps != null ? pr.brazoRelajado - Math.PI * p.triceps / 10 : null;
  const musloCorr = pr.musloMedio != null && p.muslo != null ? pr.musloMedio - Math.PI * p.muslo / 10 : null;
  const piernaCorr = pr.pierna != null && p.pierna != null ? pr.pierna - Math.PI * p.pierna / 10 : null;
  return { s6, s8, s4, pct, mg, mlg, imc, icc, ict, brazoCorr, musloCorr, piernaCorr };
}
function viewIsak() {
  const evs = [...S.isak].sort((a, b) => a.fecha.localeCompare(b.fecha));
  const last = evs[evs.length - 1]; const prev = evs[evs.length - 2];
  const c = last ? calcIsak(last) : null; const cp = prev ? calcIsak(prev) : null;

  return `<div class="row between" style="margin-bottom:10px"><div class="sub">Antropometría ISAK. Las fórmulas (Durnin-Womersley + Siri) replican el informe del 15-03-2026; úsalo para comparar entre evaluaciones hechas por la misma persona.</div><button class="btn primary sm" onclick="A.isakNueva()">+ Nueva</button></div>
  ${last ? `<div class="card"><div class="row between"><div><h2>${fmtDate(last.fecha, true)}</h2><div class="sub">${esc(last.evaluador || '')}</div></div><div class="row" style="gap:4px"><button class="btn sm" onclick="A.isakEditar('${last.id}')">✎</button></div></div>

      <div class="stat"><div class="l">Σ8 pliegues</div><div class="v" style="font-size:18px">${n1(c.s8, 1)}</div>${cp ? D(c.s8, cp.s8, 1, true) : ''}</div>
      <div class="stat"><div class="l">% grasa (DW)</div><div class="v" style="font-size:18px">${n1(c.pct, 1)}</div>${cp ? D(c.pct, cp.pct, 1, true) : ''}</div>
      <div class="stat"><div class="l">Masa grasa</div><div class="v" style="font-size:18px">${n1(c.mg, 2)}</div>${cp ? D(c.mg, cp.mg, 2, true) : ''}</div>
      <div class="stat"><div class="l">Masa libre grasa</div><div class="v" style="font-size:18px">${n1(c.mlg, 2)}</div>${cp ? D(c.mlg, cp.mlg, 2) : ''}</div>

      <div class="stat"><div class="l">Brazo corregido</div><div class="v" style="font-size:18px">${n1(c.brazoCorr, 2)}</div>${cp ? D(c.brazoCorr, cp.brazoCorr, 2) : ''}</div>
      <div class="stat"><div class="l">Muslo corregido</div><div class="v" style="font-size:18px">${n1(c.musloCorr, 2)}</div>${cp ? D(c.musloCorr, cp.musloCorr, 2) : ''}</div>
      <div class="stat"><div class="l">Pierna corregida</div><div class="v" style="font-size:18px">${n1(c.piernaCorr, 2)}</div>${cp ? D(c.piernaCorr, cp.piernaCorr, 2) : ''}</div>
      <div class="stat"><div class="l">Cintura/cadera</div><div class="v" style="font-size:18px">${n1(c.icc, 2)}</div></div>

    ${last.notas ? `<div class="small" style="margin-top:6px">${esc(last.notas)}</div>` : ''}
  </div>
  <div class="card"><h3>Pliegues (mm)</h3><div class="tbl-wrap"><table><tr><th>Pliegue</th>${evs.map((e) => `<th class="num">${fmtDate(e.fecha)}</th>`).join('')}</tr>${PLIEGUES.map(([k, l]) => `<tr><td>${l}</td>${evs.map((e) => `<td class="num">${n1(e.pliegues?.[k], 1)}</td>`).join('')}</tr>`).join('')}<tr><td><b>Σ8</b></td>${evs.map((e) => `<td class="num b">${n1(calcIsak(e).s8, 1)}</td>`).join('')}</tr></table></div></div>
  <div class="card"><h3>Perímetros (cm)</h3><div class="tbl-wrap"><table><tr><th>Perímetro</th>${evs.map((e) => `<th class="num">${fmtDate(e.fecha)}</th>`).join('')}</tr>${PERIMETROS.map(([k, l]) => `<tr><td>${l}</td>${evs.map((e) => `<td class="num">${n1(e.perimetros?.[k], 1)}</td>`).join('')}</tr>`).join('')}</table></div></div>
  ${evs.length > 1 ? `<div class="card"><h3>Evolución Σ8 y % grasa</h3>${lineChart([{ name: 'Σ8 (mm)', color: 'var(--accent)', points: evs.map((e) => ({ y: calcIsak(e).s8 })) }, { name: '% grasa', color: 'var(--f)', points: evs.map((e) => ({ y: calcIsak(e).pct })) }], { h: 180, labels: evs.map((e) => fmtDate(e.fecha)) })}</div>` : ''}
  ${evs.length > 1 ? `<div class="list card tight">${evs.slice().reverse().map((e) => `<div class="li"><span class="grow">${fmtDateLong(e.fecha)} ${e.historico ? '<span class="hist-badge">BASE</span>' : ''}</span><button class="btn xs" onclick="A.isakEditar('${e.id}')">✎</button><button class="btn xs danger" onclick="A.isakBorrar('${e.id}')">✕</button></div>`).join('')}</div>` : ''}` : '<div class="empty">Sin evaluaciones.</div>'}`;
}
function formIsak(e) {
  const g = (arr, obj, pre) => `<div class="grid2">${arr.map(([k, l]) => `<div class="row" style="gap:6px"><span class="xs muted" style="width:86px;flex:none">${l}</span><input id="ik-${pre}-${k}" type="number" inputmode="decimal" step="any" value="${obj?.[k] ?? ''}"></div>`).join('')}</div>`;

const DIARIO_F = (n) => [{ k: 'fecha', label: 'Fecha', type: 'date', value: n?.fecha || today() }, { k: 'sueno', label: 'Horas de sueño', type: 'number', value: n?.sueno ?? '' }, { k: 'energia', label: 'Energía (1-5)', type: 'number', value: n?.energia ?? '' }, { k: 'texto', label: 'Nota', type: 'textarea', value: n?.texto || '' }];
A.diarioNuevo = () => promptBox('Nota del diario', DIARIO_F(null), (o) => { S.diario.push({ id: uid('dn'), fecha: o.fecha, sueno: o.sueno, energia: o.energia, texto: o.texto }); save(); render(); });
A.diarioEdit = (id) => { const n = S.diario.find((x) => x.id === id); promptBox('Editar nota', [...DIARIO_F(n), { k: 'del', label: 'Eliminar', type: 'select', value: 'no', opts: [{ v: 'no', l: 'No' }, { v: 'si', l: 'Sí' }] }], (o) => { if (o.del === 'si') S.diario = S.diario.filter((x) => x.id !== id); else Object.assign(n, { fecha: o.fecha, sueno: o.sueno, energia: o.energia, texto: o.texto }); save(); render(); }); };
function viewPerfil() {
  const p = S.profile;
  const F = [['nombre', 'Nombre'], ['fechaNac', 'Fecha de nacimiento', 'date'], ['altura', 'Altura (cm)', 'number'], ['pesoObjetivo', 'Peso objetivo (kg)', 'number'], ['objetivo', 'Objetivo'], ['prepNombre', 'Nombre de la preparación'], ['prepInicio', 'Inicio de la preparación', 'date'], ['experiencia', 'Experiencia'], ['horarios', 'Horarios'], ['lesiones', 'Lesiones / molestias'], ['preferencias', 'Preferencias alimentarias'], ['suplementos', 'Suplementación habitual'], ['comidasLibres', 'Comidas libres']];
  return setHeader('Perfil', back()) + `<div class="card">${F.map(([k, l, t]) => `<label class="f">${l}</label><input type="${t || 'text'}" ${t === 'number' ? 'inputmode="decimal" step="any"' : ''} value="${esc(p[k] ?? '')}" onchange="S.profile['${k}']=${t === 'number' ? 'num(this.value)' : 'this.value'};save()">`).join('')}
  <label class="f">Sexo (para fórmulas)</label><select onchange="S.profile.sexo=this.value;save()"><option value="M" ${p.sexo === 'M' ? 'selected' : ''}>Hombre</option><option value="F" ${p.sexo === 'F' ? 'selected' : ''}>Mujer</option></select>
  <label class="f">Descanso por defecto entre series (s)</label><input type="number" inputmode="numeric" value="${S.settings.descansoSeg}" onchange="S.settings.descansoSeg=num(this.value)||90;save()"></div>
  <div class="card"><h3>Nueva preparación</h3><div class="sub">Archiva las revisiones actuales como histórico y empieza de cero (día 0) manteniendo rutinas, dieta y alimentos.</div><button class="btn block warn" style="margin-top:8px" onclick="A.nuevaPrep()">Empezar nueva preparación</button></div>`;
}
A.nuevaPrep = () => confirmBox('¿Archivar las revisiones actuales como histórico y empezar una nueva preparación?', () => { S.revisiones.forEach((r) => r.historico = true); S.profile.prepInicio = today(); S.profile.prepNombre = 'Preparación ' + today().slice(0, 4); save(); toast('Nueva preparación iniciada'); render(); });

function viewDatos() {
  const nf = S.revisiones.reduce((a, r) => a + (r.fotos?.length || 0), 0);
  return setHeader('Datos', back()) + `<div class="card"><h2>Copia de seguridad</h2><div class="sub">Todo se guarda solo en este iPhone. Si borras la app de la pantalla de inicio o los datos de Safari, se pierde. Exporta una copia cada cierto tiempo y guárdala en iCloud Drive o envíatela.</div>
  <div class="row" style="margin-top:10px"><button class="btn block primary" onclick="A.exportar(false)">Exportar datos</button><button class="btn block" onclick="A.exportar(true)">Con fotos (${nf})</button></div>
  <label class="btn block" style="margin-top:8px">Importar copia… <input type="file" accept=".json,application/json" style="display:none" onchange="A.importar(this.files[0])"></label></div>
  <div class="card"><h2>Exportar a Excel (CSV)</h2><div class="row"><button class="btn block" onclick="A.csvRevisiones()">Revisiones</button><button class="btn block" onclick="A.csvSesiones()">Entrenos</button><button class="btn block" onclick="A.csvPeso()">Peso diario</button></div></div>
  <div class="card"><h2>Resumen</h2><div class="small">${S.sesiones.length} entrenos · ${S.revisiones.filter((r) => !r.historico).length} revisiones (+${S.revisiones.filter((r) => r.historico).length} históricas) · ${S.pesoDiario.length} pesajes · ${nf} fotos · ${S.alimentos.length} alimentos · ${S.rutinas.length} rutinas · ${S.dietas.length} dietas</div><div class="xs muted" style="margin-top:4px">Espacio usado por datos (sin fotos): ${n1((localStorage.getItem(LS_KEY) || '').length / 1024, 0)} KB</div></div>
  <div class="card"><h2>Zona peligrosa</h2><button class="btn block danger" onclick="A.resetAll()">Borrar todo y volver a los datos iniciales</button></div>`;
}
A.exportar = async (conFotos) => {
  const out = { app: 'prep_app', version: 1, fecha: new Date().toISOString(), state: S };
  if (conFotos) { toast('Preparando fotos…', 3000); out.fotos = await IDB.all(); }
  downloadText(`prep_backup_${today()}${conFotos ? '_fotos' : ''}.json`, JSON.stringify(out));
};
A.importar = (file) => { if (!file) return; const fr = new FileReader(); fr.onload = async () => { try { const o = JSON.parse(fr.result); if (!o.state || o.app !== 'prep_app') throw 0; confirmBox(`Importar copia del ${fmtDate(o.fecha.slice(0, 10), true)}? Sustituirá los datos actuales.`, async () => { S = o.state; migrate(); save(true); if (o.fotos?.length) { for (const f of o.fotos) await IDB.put(f); } toast('Datos importados'); render(); }); } catch (e) { toast('Archivo no válido'); } }; fr.readAsText(file); };
const csv = (rows) => rows.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
A.csvRevisiones = () => downloadText(`revisiones_${today()}.csv`, '﻿' + csv([['Fecha', 'Histórico', 'Peso', ...MEDIDAS.map((m) => m[1]), 'Fase', ...VALORACION.map((v) => v[1]), ...FEEDBACK.map((f) => 'FB ' + f[1]), 'Notas'], ...[...S.revisiones].sort((a, b) => a.fecha.localeCompare(b.fecha)).map((r) => [r.fecha, r.historico ? 'sí' : 'no', r.peso, ...MEDIDAS.map(([k]) => r.medidas?.[k]), r.fase, ...VALORACION.map(([k]) => r.valoracion?.[k]), ...FEEDBACK.map(([k]) => r.feedback?.[k]), r.notas])]), 'text/csv');
A.csvSesiones = () => downloadText(`entrenos_${today()}.csv`, '﻿' + csv([['Fecha', 'Día', 'Fase', 'Ejercicio', 'Tipo serie', 'Kg', 'Reps', 'RPE sesión', 'Notas'], ...[...S.sesiones].sort((a, b) => a.fecha.localeCompare(b.fecha)).flatMap((s) => s.ejercicios.flatMap((e) => e.series.filter((r) => r.kg != null || r.reps != null).map((r) => [s.fecha, s.diaNombre, s.fase, e.nombre, TIPO_SERIE[r.t] || r.t, r.kg, r.reps, s.rpe, e.notas])))]), 'text/csv');
A.csvPeso = () => downloadText(`peso_${today()}.csv`, '﻿' + csv([['Fecha', 'Kg'], ...[...S.pesoDiario].sort((a, b) => a.fecha.localeCompare(b.fecha)).map((p) => [p.fecha, p.kg])]), 'text/csv');
A.resetAll = () => confirmBox('Se borrarán TODOS los datos y fotos de este dispositivo. ¿Seguro?', async () => { await IDB.clear(); localStorage.removeItem(LS_KEY); S = defaultState(); save(true); toast('Datos reiniciados'); A.go('inicio'); }, true);

</script>
</body>
</html>
